name: landing-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use npm 12 (declared toolchain)
        run: npm install -g npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Full static export (output: "export") — ./out is the deploy artifact.
      - name: Build (static export)
        run: npm run build
