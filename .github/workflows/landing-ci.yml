name: landing-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - name: Use npm 12 (declared toolchain)
        run: npm install -g npm@12.0.1

      # package.json pins every dependency to an exact version and is the source of
      # truth in CI exactly as it is locally, so `npm install` rather than `npm ci`.
      # `npm ci` would also hard-fail on any lockfile/package.json drift, which we
      # want reconciled rather than fatal.
      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      # Full static export (output: "export") — ./out is the deploy artifact.
      - name: Build (static export)
        run: npm run build
